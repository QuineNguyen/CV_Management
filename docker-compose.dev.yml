services:
  mariadb:
    ports:
      - "3306:3306"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cvproject-mailhog
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "8025:8025"
    networks: [cvproject]

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost}
    ports:
      - "8080:8080"
