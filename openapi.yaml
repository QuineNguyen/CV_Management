openapi: 3.0.3

# =============================================================================================
# The API contract. Generated by the backend, consumed by the frontend's code generator.
#
# This file is the source of truth for the shape of the API. The frontend builds screens against
# it — and against a mock server that serves it — before the endpoints behind it exist, so a
# change here is a change to a shared interface, not an implementation detail. Renaming a field
# or a code is breaking; adding one is not.
#
# This skeleton version declares the error contract, the pagination convention and the
# authentication scheme. Feature endpoints are added stage by stage; the three conventions below
# are fixed now precisely so that later additions do not each invent their own.
# =============================================================================================

info:
  title: CV Management API
  version: 0.1.0
  description: |
    Internal system for maintaining employee CVs.

    ## Errors

    Every failure returns the same `ApiError` body with a stable, machine-readable `code`.
    Clients branch on `code`, never on `message` — wording changes without notice.

    | Status | Meaning |
    |---|---|
    | 400 | Malformed request or failed validation; `fieldErrors` lists the offending fields |
    | 401 | Not signed in, or the token predates the account's revocation mark |
    | 403 | Authenticated, but the data is outside the caller's scope |
    | 404 | No such item |
    | 409 | Someone else changed the item first; reload and retry |
    | 422 | Well-formed request that breaks a business rule |

    ## Data scoping

    Every list endpoint returns exactly the rows the caller may see. Clients must not filter by
    role: doing so would hide the case where server-side scoping is wrong, which is the failure
    worth catching.

    ## Lists

    Collections are wrapped in `Page`. Sorting uses `sort=field,direction`, repeatable.

servers:
  - url: /api
    description: Same origin, behind the reverse proxy

security:
  - bearerAuth: []

tags:
  - name: System
    description: Health and configuration
  - name: Authentication
    description: Sign-in, sign-out and password management

paths:
  /health:
    get:
      tags: [System]
      summary: Platform status
      description: |
        Reports the applied schema version plus the time zone and character set actually in effect.
        These are surfaced deliberately: a mismatch between the application and the database in
        either one corrupts data silently, and checking from outside the containers is far easier
        than noticing after the fact.
      security: []
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with a username and password
      description: |
        Returns a bearer token and the signed-in user.

        Repeated failures lock the account for a short period. The response does not distinguish an
        unknown username from a wrong password — telling the caller which half was correct would
        make the endpoint an account-enumeration tool.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out
      description: |
        Moves the account's token revocation mark forward, so tokens still held in other tabs or on
        other devices stop working immediately. Discarding the token client-side alone would leave
        those sessions alive until expiry.
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/google:
    post:
      tags: [Authentication]
      summary: Sign in with Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Google ID token issued to the frontend by Google Identity Services
      responses:
        '200':
          description: Signed in via Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change own password
      description: Revokes every live token for the account; the caller must sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; all sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /admin/users/{userId}/reset-password:
    post:
      tags: [Users]
      summary: Admin resets a user's password
      description: >
        Returns the temporary password for one-time display in the admin dialog and
        sends it to the user by email. The audit entry never records the password.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The token carries the caller's role. Because roles can change and accounts can be
        deactivated mid-session, the server also checks the token's issue time against a
        per-account revocation mark and answers 401 when the token predates it.

  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Not signed in, or the session has been revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The requested data is outside the caller's scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: No such item
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Someone else changed the item first
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: The request breaks a business rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      description: 'Sort instruction as `field,direction`. Repeat for multiple keys.'
      schema:
        type: array
        items:
          type: string
        example: ['updatedAt,desc']

  schemas:
    ApiError:
      type: object
      required: [timestamp, status, error, code, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-08-07T14:30:00+07:00'
        status:
          type: integer
          example: 422
        error:
          type: string
          example: UNPROCESSABLE_ENTITY
        code:
          type: string
          description: Stable machine-readable cause. Branch on this, not on `message`.
          example: PENDING_REQUEST_EXISTS
        message:
          type: string
          description: Fallback wording for logs and direct API consumers.
        path:
          type: string
          example: /api/update-requests
        fieldErrors:
          type: array
          description: Present only on validation failures.
          items:
            $ref: '#/components/schemas/ApiFieldError'

    ApiFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: deadlineDate
        message:
          type: string
          example: must not be null

    Page:
      type: object
      description: |
        Envelope for every collection response. Uniform on purpose: a client that can render one
        list can render all of them, and adding a new list does not add a new shape to handle.
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    HealthStatus:
      type: object
      required: [status, serverTime, jvmTimeZone, dbTimeZone, dbCharset, schemaVersion]
      properties:
        status:
          type: string
          example: UP
        serverTime:
          type: string
          format: date-time
        jvmTimeZone:
          type: string
          example: Asia/Ho_Chi_Minh
        dbTimeZone:
          type: string
          example: '+07:00'
        dbCharset:
          type: string
          example: utf8mb4
        dbCollation:
          type: string
          example: utf8mb4_unicode_ci
        schemaVersion:
          type: string
          example: '8'

    Role:
      type: string
      description: Each account holds exactly one role.
      enum: [ADMIN, HR, TECH_LEAD, EMPLOYEE]

    Language:
      type: string
      description: A CV exists in exactly one language; a profile may hold one CV per language.
      enum: [VI, EN, JA]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      required: [id, fullName, email, role, mustChangePassword]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        mustChangePassword:
          type: boolean
          description: |
            True for seeded accounts and after an administrator resets a password. The client must
            route to the password-change screen before anything else.

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          description: At least 8 characters with uppercase, lowercase, digit and special character
        confirmPassword:
          type: string
          format: password

    ResetPasswordResponse:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          description: Shown once in the admin dialog; also delivered by email